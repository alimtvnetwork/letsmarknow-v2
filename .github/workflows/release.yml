name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Installer & Publish GitHub Pre-Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Determine Application Version
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) {
            if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match "^v*(.+)$") {
              $ver = $Matches[1]
            } else {
              $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
              $ver = $pkg.version
            }
          }
          if (-not $ver) { $ver = "1.0.0" }
          Write-Host "Resolved Version: $ver"
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG_NAME=v$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          $innoDir = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (Test-Path $innoDir) {
            [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$innoDir`n")
          }

      - name: Build Extension, Launcher & Inno Setup Installer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          try {
            .\installer\build-installer.ps1 -Version "${{ env.APP_VERSION }}"
          } catch {
            $err = "$($_.Exception.Message)`n$($_.ScriptStackTrace)"
            Write-Host "::error title=Build Failure::$err"
            "## Build Failure`n````powershell`n$err`n```" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }

      - name: Verify Distributable Artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist-installer -Filter "LetsMarkNow-Setup-v*.exe"
          $portable = Get-ChildItem -Path dist-installer -Filter "LetsMarkNow-Portable-v*.zip"
          $checksums = Get-ChildItem -Path dist-installer -Filter "checksums.txt"

          if (-not $installer) { throw "Missing LetsMarkNow-Setup-v*.exe in dist-installer/" }
          if (-not $portable) { throw "Missing LetsMarkNow-Portable-v*.zip in dist-installer/" }
          if (-not $checksums) { throw "Missing checksums.txt in dist-installer/" }

          Write-Host "Verified Artifacts:" -ForegroundColor Green
          Write-Host "  * $($installer.Name) ($([Math]::Round($installer.Length / 1MB, 2)) MB)"
          Write-Host "  * $($portable.Name) ($([Math]::Round($portable.Length / 1MB, 2)) MB)"
          Write-Host "  * $($checksums.Name)"

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: LetsMarkNow v${{ env.APP_VERSION }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            dist-installer/LetsMarkNow-Setup-v*.exe
            dist-installer/LetsMarkNow-Portable-v*.zip
            dist-installer/install.ps1
            dist-installer/uninstall.ps1
            dist-installer/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
